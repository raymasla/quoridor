<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>步步為營</title>
    <style>
        /* ========================================= */
        /* --- 全局暗色系主題與動畫 (Dark Theme) --- */
        /* ========================================= */
        :root {
            --bg-color: #0f172a;
            --container-bg: rgba(30, 41, 59, 0.85);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --primary-grad: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --border-radius: 12px;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 介面容器 (玻璃擬態) */
        .screen {
            display: none;
            width: 100%;
            max-width: 550px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        .card {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1, h2, h3 { 
            margin-top: 0; text-align: center; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
        }
        
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 按鈕美化 */
        .btn {
            background: var(--primary-grad);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .btn:hover { 
            transform: translateY(-3px) scale(1.02); 
            box-shadow: 0 8px 25px rgba(255,255,255,0.2); 
        }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-red { background: linear-gradient(135deg, #ef4444, #991b1b); }
        .btn-green { background: linear-gradient(135deg, #10b981, #047857); }
        .btn-orange { background: linear-gradient(135deg, #f97316, #c2410c); }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #8b5cf6; }

        /* 房間列表 */
        #room-list-container {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
        }
        .room-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }
        .room-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(5px); }
        .room-item button { width: auto; margin: 0; padding: 8px 16px; background: var(--accent-green); }

        /* --- 遊戲棋盤區 (9列 x 11行) --- */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        #board-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        #board {
            display: grid;
            /* 9格 X軸 (32px格 + 10px牆槽) */
            grid-template-columns: repeat(8, 32px 10px) 32px;
            /* 11格 Y軸 (包含頭尾兩側的 Bank 對岸區) */
            grid-template-rows: repeat(10, 32px 10px) 32px;
            gap: 0;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            touch-action: none; 
            margin: 5px 0;
        }
        
        .bank-label {
            width: 100%; text-align: center; color: var(--text-muted); 
            font-weight: bold; margin: 5px 0; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* ---- 翻轉畫面 (P2視角) ---- */
        #board.rotated {
            transform: rotate(180deg);
        }

        .cell {
            width: 32px; height: 32px;
            background: #334155;
            border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; position: relative;
            transition: 0.2s; user-select: none;
        }
        .cell:hover { background: #475569; }
        
        /* 區分對岸區的顏色 */
        .bank-cell { background: rgba(99, 102, 241, 0.15); border: 1px dashed #6366f1; }
        
        .cell.valid-move::after {
            content: ''; position: absolute;
            width: 14px; height: 14px;
            background: rgba(16, 185, 129, 0.7);
            border-radius: 50%; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        
        /* 牆壁基礎設定 */
        .wall-h { width: 32px; height: 10px; background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; }
        .wall-v { width: 10px; height: 32px; background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s; }
        .wall-c { width: 10px; height: 10px; background: transparent; }
        .wall-h:hover, .wall-v:hover { background: rgba(255,255,255,0.2); }

        /* 牆壁狀態 */
        .wall-filled { background: #facc15 !important; box-shadow: 0 0 8px rgba(250, 204, 21, 0.6); cursor: not-allowed; }
        .wall-pending { background: #fb923c !important; }
        .wall-highlight { background: rgba(251, 146, 60, 0.5) !important; box-shadow: 0 0 5px rgba(251, 146, 60, 0.5); cursor: pointer; }

        .player-emoji { transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94); z-index: 10; font-size: 20px; }
        /* P2棋子在自己棋盤上要再反轉180度讓它朝向自己 */
        .rotated .player-emoji { transform: rotate(180deg); }

        #status-bar { 
            margin: 10px 0; font-size: 1.1em; font-weight: bold; 
            background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 20px;
            color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.3); text-align: center;
        }
        #wall-count { color: #94a3b8; font-weight: bold; margin-bottom: 10px; }

        /* ---- 毀旗 (上一步) 按鈕區 ---- */
        #action-bar {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            flex-wrap: wrap;
        }

        /* ---- 勝利動畫遮罩 ---- */
        #win-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.4s ease;
        }
        #win-overlay.show { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .win-card {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            border: 2px solid #a78bfa;
            border-radius: 24px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 0 60px rgba(167,139,250,0.4), 0 20px 60px rgba(0,0,0,0.6);
            animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5) rotate(-5deg); }
            to   { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .win-emoji {
            font-size: 80px;
            display: block;
            animation: bounce 0.8s ease infinite alternate;
            filter: drop-shadow(0 0 20px rgba(250,204,21,0.8));
        }

        @keyframes bounce {
            from { transform: translateY(0px) scale(1); }
            to   { transform: translateY(-15px) scale(1.1); }
        }

        .win-title {
            font-size: 2em;
            font-weight: 900;
            margin: 20px 0 10px;
            background: linear-gradient(to right, #facc15, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        .win-subtitle {
            font-size: 1.1em;
            color: #c4b5fd;
            margin-bottom: 30px;
        }

        .confetti-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            width: 10px;
            height: 14px;
            opacity: 0.9;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* 讓bank-label在P2視角也顯示正確 */
        #bank-label-top, #bank-label-bottom {
            transition: opacity 0.3s;
        }

        /* --- 咖啡色按鈕 --- */
        .btn-coffee { background: linear-gradient(135deg, #7c5c3e, #a97142); }

        .room-tag {
            font-size: 12px; font-weight: bold; color: #d6b08c;
            background: rgba(169,113,66,0.2); border: 1px solid rgba(169,113,66,0.5);
            border-radius: 999px; padding: 2px 8px; margin-left: 6px;
        }

        /* --- 自訂棋盤設定介面 --- */
        .size-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin: 10px 0;
        }
        .size-row .label { color: var(--text-muted); font-weight: bold; }
        .stepper { display: flex; align-items: center; gap: 12px; }
        .stepper button {
            width: 38px; height: 38px; border-radius: 10px; border: var(--glass-border);
            background: rgba(255,255,255,0.06); color: var(--text-main);
            font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .stepper button:hover { background: rgba(255,255,255,0.16); }
        .stepper .value { min-width: 32px; text-align: center; font-size: 20px; font-weight: 900; color: #facc15; }

        #setup-board-wrap {
            display: flex; justify-content: center; align-items: center;
            width: 100%; overflow: auto; padding: 6px 0;
        }
        #setup-board {
            display: grid; gap: 4px; margin: 0 auto;
            background: #1e293b; padding: 12px; border-radius: 12px;
            border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .setup-cell {
            background: #334155; border-radius: 6px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; border: 2px solid transparent; transition: 0.15s;
            user-select: none;
        }
        .setup-cell:hover { transform: scale(1.08); }
        .setup-cell.setup-start { box-shadow: 0 0 10px currentColor; }

        #setup-switch-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .setup-switch-btn { flex: 1 1 40%; margin-top: 0 !important; padding: 10px !important; font-size: 14px !important; }
        #setup-hint { color: var(--text-muted); font-size: 13px; text-align: center; margin-top: 10px; }

        .goal-cell { border: 1px solid rgba(255,255,255,0.25); }
    </style>
</head>
<body>

    <div id="screen-home" class="screen active">
        <h1 class="gradient-text">🎮 步步為營 大廳</h1>
        <div id="room-list-container" class="card">
            <h3>可加入的房間</h3>
            <div id="room-list">讀取中...</div>
        </div>
        <button class="btn btn-green" id="btn-show-create">創立標準棋盤</button>
        <button class="btn btn-coffee" id="btn-show-custom">創立自訂棋盤</button>
    </div>

    <div id="screen-create" class="screen">
        <div class="card">
            <h2 class="gradient-text">創立新房間</h2>
            <input type="text" id="input-room-name" value="步步為營" placeholder="房間名稱">
            <input type="password" id="input-room-pass" placeholder="密碼 (空白為無)">
            <button class="btn btn-green" id="btn-create-room">確認創立</button>
            <button class="btn" style="background:transparent; border:1px solid #475569; color:#cbd5e1; box-shadow:none;" onclick="switchScreen('screen-home')">返回</button>
        </div>
    </div>

    <!-- 自訂棋盤設定 -->
    <div id="screen-custom" class="screen">
        <div class="card">
            <h2 class="gradient-text">自訂棋盤設定</h2>
            <div class="size-row">
                <span class="label">棋盤寬（欄）</span>
                <div class="stepper">
                    <button onclick="adjustSize('cols', -1)">－</button>
                    <span class="value" id="size-cols">7</span>
                    <button onclick="adjustSize('cols', 1)">＋</button>
                </div>
            </div>
            <div class="size-row">
                <span class="label">棋盤長（列）</span>
                <div class="stepper">
                    <button onclick="adjustSize('rows', -1)">－</button>
                    <span class="value" id="size-rows">7</span>
                    <button onclick="adjustSize('rows', 1)">＋</button>
                </div>
            </div>
        </div>

        <div id="setup-board-wrap">
            <div id="setup-board"></div>
        </div>

        <div class="card">
            <button class="btn" id="btn-setup-state">加入玩家一</button>
            <div id="setup-switch-row" style="display:none;"></div>
            <button class="btn btn-green" id="btn-setup-next">確定／下一位</button>
            <button class="btn btn-orange" id="btn-setup-done" style="display:none;">完成玩家設定，進入終點佈置</button>
            <div id="setup-hint"></div>
        </div>

        <div class="card">
            <input type="text" id="input-custom-name" value="自訂棋盤" placeholder="房間名稱">
            <input type="password" id="input-custom-pass" placeholder="密碼 (空白為無)">
            <button class="btn btn-green" id="btn-setup-create">建立房間</button>
            <button class="btn" style="background:transparent; border:1px solid #475569; color:#cbd5e1; box-shadow:none;" onclick="switchScreen('screen-home')">返回</button>
        </div>
    </div>

    <div id="screen-join" class="screen">
        <div class="card">
            <h2 class="gradient-text">加入房間</h2>
            <input type="text" id="input-nickname" placeholder="您的暱稱">
            <input type="text" id="input-emoji" placeholder="點此輸入代表 Emoji 🏳️" maxlength="2">
            <input type="password" id="input-join-pass" placeholder="輸入房間密碼 (若有)">
            <button class="btn btn-green" id="btn-join-room">進入</button>
            <button class="btn" style="background:transparent; border:1px solid #475569; color:#cbd5e1; box-shadow:none;" onclick="switchScreen('screen-home')">返回</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div id="status-bar">等待玩家中...</div>
        <div id="wall-count"></div>
        
        <div id="game-container">
            <div class="bank-label" id="bank-label-top">⬆️ 對岸 (P2 的起始區) ⬆️</div>
            <div id="board-container">
                <div id="board"></div>
            </div>
            <div class="bank-label" id="bank-label-bottom">⬇️ 我方 (P1 的起始區) ⬇️</div>
        </div>

        <div id="action-bar">
            <button class="btn btn-orange" id="btn-undo" style="display:none;">🏳️ 毀旗 (上一步)</button>
            <button class="btn btn-green" id="btn-start-game" style="display:none;">開始同機對戰</button>
            <button class="btn btn-red" id="btn-leave-room">離開房間</button>
        </div>
    </div>

    <div id="win-overlay">
        <div class="confetti-wrapper" id="confetti-wrapper"></div>
        <div class="win-card">
            <span class="win-emoji" id="win-emoji">🏆</span>
            <div class="win-title" id="win-title">勝利！</div>
            <div class="win-subtitle" id="win-subtitle">恭喜贏得比賽！</div>
            <button class="btn btn-green" onclick="location.reload()" style="margin-top:10px;">🔁 再來一局</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, get, remove }
        from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC7PZLTTNf17cfp9gCHudWiWX8SYPSCdDI",
        authDomain: "onlineeasyraygame.firebaseapp.com",
        databaseURL: "https://onlineeasyraygame-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "onlineeasyraygame",
        storageBucket: "onlineeasyraygame.firebasestorage.app",
        messagingSenderId: "622138442346",
        appId: "1:622138442346:web:375980b448fb9b3f428013",
        measurementId: "G-ZDEGMGYGVB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ===== 玩家代表色 =====
    const PLAYER_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#facc15'];
    const PLAYER_RGBA   = ['239,68,68', '59,130,246', '16,185,129', '250,204,21'];
    const PLAYER_NAMES  = ['玩家一', '玩家二', '玩家三', '玩家四'];
    const ROLE_OF = i => 'p' + (i + 1);
    const IDX_OF = role => parseInt(String(role).slice(1), 10) - 1;

    const DEFAULT_COLS = 9, DEFAULT_ROWS = 11;

    let currentRoomId = null;
    let myPlayerId = null;
    let isHost = false;
    let gameState = null;
    let localMode = false;
    let selectedPawn = false;
    let pendingWall = null;
    let moveHistory = [];
    let winShown = false;
    let boardBuiltKey = '';

    // ===== 棋盤參數（由房間設定推導） =====
    function cfgCols() { return gameState?.cols || DEFAULT_COLS; }
    function cfgRows() { return gameState?.rows || DEFAULT_ROWS; }
    function maxX() { return (cfgCols() - 1) * 2; }
    function maxY() { return (cfgRows() - 1) * 2; }
    function isCustom() { return gameState?.mode === 'custom'; }
    function maxPlayers() { return gameState?.maxPlayers || 2; }
    function activeRoles() {
        const n = maxPlayers();
        return Array.from({ length: n }, (_, i) => ROLE_OF(i));
    }
    // 標準棋盤的預設終點（整排底/頂）
    function defaultGoals(role, cols, rows) {
        const y = role === 'p1' ? 0 : (rows - 1) * 2;
        return Array.from({ length: cols }, (_, i) => ({ x: i * 2, y }));
    }
    function goalsOf(role) {
        const g = gameState?.config?.goals?.[role];
        if (g && g.length) return g;
        return defaultGoals(role, cfgCols(), cfgRows());
    }

    window.switchScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    };

    document.getElementById('btn-show-create').addEventListener('click', () => switchScreen('screen-create'));

    const roomsRef = ref(db, 'quoridor_rooms');
    onValue(roomsRef, (snapshot) => {
        const listDiv = document.getElementById('room-list');
        listDiv.innerHTML = '';
        if (!snapshot.exists()) {
            listDiv.innerHTML = '<div style="color:var(--text-muted);">目前沒有房間，趕快創立一個吧！</div>';
            return;
        }
        snapshot.forEach((child) => {
            const room = child.val();
            if (room.status === 'waiting') {
                const div = document.createElement('div');
                div.className = 'room-item';
                const needPass = room.password ? ' 🔒' : '';
                const cap = room.maxPlayers || 2;
                const count = room.players ? Object.keys(room.players).length : 0;
                const tag = room.mode === 'custom'
                    ? `<span class="room-tag">自訂 ${room.cols}x${room.rows}</span>` : '';
                div.innerHTML = `
                    <span style="font-weight:bold;">${room.name} ${needPass} (${count}/${cap}) ${tag}</span>
                    <button class="btn btn-green" onclick="prepareJoin('${child.key}', ${!!room.password})">加入</button>
                `;
                listDiv.appendChild(div);
            }
        });
    });

    // ===== 建立標準房間 =====
    document.getElementById('btn-create-room').addEventListener('click', async () => {
        const name = document.getElementById('input-room-name').value || '步步為營';
        const pass = document.getElementById('input-room-pass').value;
        const newRoomRef = push(roomsRef);
        await set(newRoomRef, {
            name, password: pass, status: 'waiting', turn: 0,
            mode: 'standard', cols: DEFAULT_COLS, rows: DEFAULT_ROWS, maxPlayers: 2,
            config: {
                starts: { p1: { x: 8, y: 20 }, p2: { x: 8, y: 0 } },
                goals: {
                    p1: defaultGoals('p1', DEFAULT_COLS, DEFAULT_ROWS),
                    p2: defaultGoals('p2', DEFAULT_COLS, DEFAULT_ROWS)
                }
            },
            board: { walls: [], p1: null, p2: null }
        });
        currentRoomId = newRoomRef.key;
        isHost = true;
        prepareJoin(currentRoomId, false, true);
    });

    /* =========================================================
       ============  自訂棋盤設定介面 (Custom Setup)  ============
       ========================================================= */
    const setup = {
        cols: 7, rows: 7,
        phase: 'starts',      // 'starts' | 'goals'
        currentIdx: 0,
        starts: [null, null, null, null],
        goals: [[], [], [], []]
    };

    document.getElementById('btn-show-custom').addEventListener('click', () => {
        setup.cols = 7; setup.rows = 7;
        setup.phase = 'starts'; setup.currentIdx = 0;
        setup.starts = [null, null, null, null];
        setup.goals = [[], [], [], []];
        setup.deleteTarget = null;
        renderSetup();
        switchScreen('screen-custom');
    });

    function setupPlayerCount() { return setup.starts.filter(Boolean).length; }

    function clampSize(v) { return Math.max(3, Math.min(15, v)); }

    function resetSetupPlayers() {
        setup.starts = [null, null, null, null];
        setup.goals = [[], [], [], []];
        setup.phase = 'starts';
        setup.currentIdx = 0;
        setup.deleteTarget = null;
    }

    window.adjustSize = function(which, delta) {
        const next = which === 'cols' ? clampSize(setup.cols + delta) : clampSize(setup.rows + delta);
        if (next === (which === 'cols' ? setup.cols : setup.rows)) return;
        if (setupPlayerCount() > 0) {
            if (!confirm('調整棋盤需先清出所有已設定的玩家，確定要繼續嗎？')) return;
            resetSetupPlayers();
        }
        if (which === 'cols') setup.cols = clampSize(setup.cols + delta);
        else setup.rows = clampSize(setup.rows + delta);
        // 移除超出範圍的設定
        const cx = (setup.cols - 1) * 2, cy = (setup.rows - 1) * 2;
        setup.starts = setup.starts.map(s => (s && s.x <= cx && s.y <= cy) ? s : null);
        setup.goals = setup.goals.map(list => list.filter(g => g.x <= cx && g.y <= cy));
        renderSetup();
    };

    function goalOwnersAt(x, y) {
        const owners = [];
        setup.goals.forEach((list, i) => {
            if (setup.starts[i] && list.some(g => g.x === x && g.y === y)) owners.push(i);
        });
        return owners;
    }

    // 多色格 CSS（1~4 位玩家）
    function multiColorStyle(owners) {
        const c = owners.map(i => `rgba(${PLAYER_RGBA[i]},0.55)`);
        const glow = `box-shadow: 0 0 10px rgba(${PLAYER_RGBA[owners[0]]},0.7);`;
        if (c.length === 1) return `background: ${c[0]}; ${glow}`;
        if (c.length === 2) return `background: linear-gradient(135deg, ${c[0]} 0 50%, ${c[1]} 50% 100%); ${glow}`;
        if (c.length === 3) return `background: conic-gradient(${c[0]} 0turn 0.3333turn, ${c[1]} 0.3333turn 0.6667turn, ${c[2]} 0.6667turn 1turn); ${glow}`;
        return `background: conic-gradient(${c[0]} 0turn 0.25turn, ${c[1]} 0.25turn 0.5turn, ${c[2]} 0.5turn 0.75turn, ${c[3]} 0.75turn 1turn); ${glow}`;
    }

    function renderSetup() {
        document.getElementById('size-cols').innerText = setup.cols;
        document.getElementById('size-rows').innerText = setup.rows;

        // --- 棋盤預覽 ---
        const prev = document.getElementById('setup-board');
        const size = Math.max(18, Math.min(38, Math.floor(320 / Math.max(setup.cols, setup.rows))));
        prev.style.gridTemplateColumns = `repeat(${setup.cols}, ${size}px)`;
        prev.innerHTML = '';
        for (let r = 0; r < setup.rows; r++) {
            for (let c = 0; c < setup.cols; c++) {
                const x = c * 2, y = r * 2;
                const d = document.createElement('div');
                d.className = 'setup-cell';
                d.style.width = size + 'px';
                d.style.height = size + 'px';
                d.style.fontSize = Math.round(size * 0.5) + 'px';

                const owners = goalOwnersAt(x, y);
                if (owners.length) d.setAttribute('style', d.getAttribute('style') + ';' + multiColorStyle(owners));

                const startIdx = setup.starts.findIndex(s => s && s.x === x && s.y === y);
                if (startIdx >= 0) {
                    d.classList.add('setup-start');
                    d.style.borderColor = PLAYER_COLORS[startIdx];
                    d.style.color = PLAYER_COLORS[startIdx];
                    d.innerText = String(startIdx + 1);
                }
                d.onclick = () => setupCellClick(x, y);
                prev.appendChild(d);
            }
        }

        // --- 操作按鈕 ---
        const stateBtn = document.getElementById('btn-setup-state');
        const nextBtn = document.getElementById('btn-setup-next');
        const doneBtn = document.getElementById('btn-setup-done');
        const switchRow = document.getElementById('setup-switch-row');
        const hint = document.getElementById('setup-hint');
        const idx = setup.currentIdx;
        stateBtn.style.background = PLAYER_COLORS[idx];
        stateBtn.style.color = idx === 3 ? '#1e293b' : '#fff';

        if (setup.phase === 'starts') {
            stateBtn.innerText = `加入${PLAYER_NAMES[idx]}`;
            nextBtn.style.display = idx < 3 ? 'block' : 'none';
            doneBtn.style.display = setupPlayerCount() >= 2 ? 'block' : 'none';
            doneBtn.innerText = '完成玩家設定，進入終點佈置';
            hint.innerText = '點擊格子設定出生點；點擊已放置的出生點可刪除該玩家。';
            switchRow.innerHTML = '';
            if (setup.deleteTarget !== null && setup.deleteTarget !== undefined && setup.starts[setup.deleteTarget]) {
                const di = setup.deleteTarget;
                const del = document.createElement('button');
                del.className = 'btn btn-red setup-switch-btn';
                del.style.flex = '1 1 100%';
                del.innerText = `刪除${PLAYER_NAMES[di]}？`;
                del.onclick = () => {
                    setup.starts[di] = null;
                    setup.goals[di] = [];
                    setup.currentIdx = di;
                    setup.deleteTarget = null;
                    renderSetup();
                };
                switchRow.appendChild(del);
                switchRow.style.display = 'flex';
            } else {
                switchRow.style.display = 'none';
            }
        } else {
            stateBtn.innerText = `設定${PLAYER_NAMES[idx]}終點`;
            nextBtn.style.display = 'none';
            doneBtn.style.display = 'none';
            hint.innerText = '點擊空地新增終點，點擊自己顏色的格子則移除。';
            switchRow.style.display = 'flex';
            switchRow.innerHTML = '';
            setup.starts.forEach((s, i) => {
                if (!s) return;
                const b = document.createElement('button');
                b.className = 'btn setup-switch-btn';
                b.style.background = PLAYER_COLORS[i];
                b.style.color = i === 3 ? '#1e293b' : '#fff';
                b.style.opacity = i === idx ? '1' : '0.45';
                b.innerText = PLAYER_NAMES[i];
                b.onclick = () => { setup.currentIdx = i; renderSetup(); };
                switchRow.appendChild(b);
            });
        }
    }

    function setupCellClick(x, y) {
        const idx = setup.currentIdx;
        if (setup.phase === 'starts') {
            const taken = setup.starts.findIndex(s => s && s.x === x && s.y === y);
            if (taken >= 0) {
                // 點擊已放置的出生點 -> 顯示刪除按鈕
                setup.deleteTarget = (setup.deleteTarget === taken) ? null : taken;
                renderSetup();
                return;
            }
            setup.deleteTarget = null;
            setup.starts[idx] = { x, y };
        } else {
            const list = setup.goals[idx];
            const at = list.findIndex(g => g.x === x && g.y === y);
            if (at >= 0) list.splice(at, 1);
            else list.push({ x, y });
        }
        renderSetup();
    }

    document.getElementById('btn-setup-next').addEventListener('click', () => {
        if (!setup.starts[setup.currentIdx]) { alert(`請先設定${PLAYER_NAMES[setup.currentIdx]}的出生點！`); return; }
        if (setup.currentIdx < 3) setup.currentIdx++;
        renderSetup();
    });

    document.getElementById('btn-setup-done').addEventListener('click', () => {
        if (setupPlayerCount() < 2) { alert('至少需要兩位玩家！'); return; }
        // 壓縮玩家序號（避免中間有空缺）
        const compactStarts = [], compactGoals = [];
        setup.starts.forEach((s, i) => { if (s) { compactStarts.push(s); compactGoals.push(setup.goals[i]); } });
        setup.starts = [...compactStarts, null, null, null, null].slice(0, 4);
        setup.goals = [...compactGoals, [], [], [], []].slice(0, 4);
        setup.phase = 'goals';
        setup.currentIdx = 0;
        setup.deleteTarget = null;
        renderSetup();
    });

    document.getElementById('btn-setup-create').addEventListener('click', async () => {
        const count = setupPlayerCount();
        if (count < 2) { alert('至少需要兩位玩家才能建立房間！'); return; }
        for (let i = 0; i < count; i++) {
            if (!setup.goals[i] || setup.goals[i].length === 0) {
                alert(`${PLAYER_NAMES[i]}還沒有設定任何終點！`); return;
            }
        }
        const starts = {}, goals = {};
        for (let i = 0; i < count; i++) {
            starts[ROLE_OF(i)] = setup.starts[i];
            goals[ROLE_OF(i)] = setup.goals[i];
        }
        const name = document.getElementById('input-custom-name').value || '自訂棋盤';
        const pass = document.getElementById('input-custom-pass').value;
        const board = { walls: [] };
        for (let i = 0; i < count; i++) board[ROLE_OF(i)] = null;

        const newRoomRef = push(roomsRef);
        await set(newRoomRef, {
            name, password: pass, status: 'waiting', turn: 0,
            mode: 'custom', cols: setup.cols, rows: setup.rows, maxPlayers: count,
            config: { starts, goals },
            board
        });
        currentRoomId = newRoomRef.key;
        isHost = true;
        prepareJoin(currentRoomId, false, true);
    });

    /* ============ 加入房間 ============ */
    window.prepareJoin = function(roomId, needsPass, isCreator = false) {
        currentRoomId = roomId;
        document.getElementById('input-join-pass').style.display = (needsPass && !isCreator) ? 'block' : 'none';
        switchScreen('screen-join');
    };

    document.getElementById('btn-join-room').addEventListener('click', async () => {
        const nick = document.getElementById('input-nickname').value;
        const emoji = document.getElementById('input-emoji').value;
        const pass = document.getElementById('input-join-pass').value;

        if (!nick || !emoji) return alert("請填寫暱稱與代表 Emoji！");

        const snapshot = await get(ref(db, `quoridor_rooms/${currentRoomId}`));
        const room = snapshot.val();
        const cap = room.maxPlayers || 2;

        if (room.password && room.password !== pass && !isHost) return alert("密碼錯誤！");
        let playerIndex = 'p1';
        if (room.players) {
            const existingPlayers = Object.values(room.players);
            if (existingPlayers.length >= cap) return alert("房間已滿！");
            if (existingPlayers.some(p => p.emoji === emoji)) return alert("這 Emoji 被其他玩家選走囉！");
            const used = new Set(existingPlayers.map(p => p.id));
            for (let i = 0; i < cap; i++) {
                if (!used.has(ROLE_OF(i))) { playerIndex = ROLE_OF(i); break; }
            }
        }

        myPlayerId = push(ref(db, `quoridor_rooms/${currentRoomId}/players`)).key;
        await update(ref(db, `quoridor_rooms/${currentRoomId}/players/${myPlayerId}`), {
            name: nick, emoji: emoji, id: playerIndex, wallsLeft: 10
        });

        saveSession();
        switchScreen('screen-game');
        initGameListener();
    });

    function getMyRole() {
        if (!gameState || !gameState.players || !myPlayerId) return null;
        return gameState.players[myPlayerId]?.id || null;
    }

    function initGameListener() {
        onValue(ref(db, `quoridor_rooms/${currentRoomId}`), (snapshot) => {
            if (!snapshot.exists()) {
                alert("房間已關閉");
                location.reload(); return;
            }
            gameState = snapshot.val();
            updateUI();
        });
    }

    const LOCAL_NAMES  = ['玩家一(本機)', '對面玩家(本機)', '玩家三(本機)', '玩家四(本機)'];
    const LOCAL_EMOJIS = ['🙂', '🙃', '🤖', '👻'];

    document.getElementById('btn-start-game').addEventListener('click', async () => {
        const players = Object.values(gameState.players || {});
        const pCount = players.length;
        const cap = maxPlayers();
        if (pCount > 1 && pCount < cap) {
            alert(`還有玩家空缺，需要 ${cap} 位玩家都到齊才能開始（目前 ${pCount} 位）`); return;
        }
        if (pCount === 1) {
            // 單機（同機）模式：自動補齊剩下的角色
            localMode = true;
            const used = new Set(players.map(p => p.id));
            const usedEmoji = new Set(players.map(p => p.emoji));
            const fill = {};
            for (let i = 0; i < cap; i++) {
                const role = ROLE_OF(i);
                if (used.has(role)) continue;
                let emoji = LOCAL_EMOJIS[i];
                if (usedEmoji.has(emoji)) emoji = LOCAL_EMOJIS[(i + 1) % 4];
                usedEmoji.add(emoji);
                fill[`${role}_local`] = { name: LOCAL_NAMES[i], emoji, id: role, wallsLeft: 10 };
            }
            if (Object.keys(fill).length) {
                await update(ref(db, `quoridor_rooms/${currentRoomId}/players`), fill);
            }
            saveSession();
        }
        moveHistory = [];
        const board = { walls: [] };
        activeRoles().forEach(role => {
            const s = gameState.config?.starts?.[role];
            board[role] = s ? { x: s.x, y: s.y } : { x: 8, y: role === 'p1' ? 20 : 0 };
        });
        await update(ref(db, `quoridor_rooms/${currentRoomId}`), {
            status: 'playing', turn: 'p1', board
        });
        saveSession();
    });

    document.getElementById('btn-leave-room').addEventListener('click', () => {
        remove(ref(db, `quoridor_rooms/${currentRoomId}/players/${myPlayerId}`));
        clearSession();
        location.reload();
    });

    /* ============ 斷線重連 (Reconnection) ============ */
    const SESSION_KEY = 'quoridor_session';
    function saveSession() {
        try {
            localStorage.setItem(SESSION_KEY, JSON.stringify({
                roomId: currentRoomId, playerId: myPlayerId, isHost, localMode
            }));
        } catch (e) {}
    }
    function clearSession() {
        try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }
    async function tryReconnect() {
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}
        if (!saved || !saved.roomId || !saved.playerId) return;
        try {
            const snap = await get(ref(db, `quoridor_rooms/${saved.roomId}`));
            const room = snap.val();
            if (!room || room.status !== 'playing' || !room.players || !room.players[saved.playerId]) {
                clearSession(); return;
            }
            currentRoomId = saved.roomId;
            myPlayerId = saved.playerId;
            isHost = !!saved.isHost;
            localMode = !!saved.localMode;
            switchScreen('screen-game');
            initGameListener();
        } catch (e) { /* 網路問題就留在大廳 */ }
    }
    tryReconnect();

    // ---- 毀旗 (上一步) ----
    document.getElementById('btn-undo').addEventListener('click', async () => {
        if (moveHistory.length === 0) { alert("已經是最開始了！"); return; }
        const isMyTurn = localMode || (gameState.players[myPlayerId]?.id === gameState.turn);
        if (!isMyTurn) { alert("還沒輪到你，不能毀旗！"); return; }
        const prev = moveHistory.pop();
        pendingWall = null;
        await update(ref(db, `quoridor_rooms/${currentRoomId}`), prev);
    });

    function nextTurnRole(role) {
        const roles = activeRoles();
        const i = roles.indexOf(role);
        return roles[(i + 1) % roles.length];
    }

    function snapshotState() {
        const snap = {
            'board/walls': [...(gameState.board.walls || [])],
            turn: gameState.turn,
            status: gameState.status
        };
        activeRoles().forEach(role => {
            if (gameState.board[role]) snap[`board/${role}`] = { ...gameState.board[role] };
        });
        if (gameState.players) {
            Object.keys(gameState.players).forEach(k => {
                snap[`players/${k}/wallsLeft`] = gameState.players[k].wallsLeft;
            });
        }
        return snap;
    }

    /* ============ 棋盤生成（動態長寬） ============ */
    function createBoardUI() {
        const cols = cfgCols(), rows = cfgRows();
        const key = `${cols}x${rows}x${isCustom() ? 'c' : 's'}`;
        if (boardBuiltKey === key) return;
        boardBuiltKey = key;

        const cellSize = Math.max(18, Math.min(32, Math.floor(330 / cols)));
        const wallSize = Math.max(6, Math.round(cellSize * 0.31));
        const board = document.getElementById('board');
        board.style.gridTemplateColumns = `repeat(${cols - 1}, ${cellSize}px ${wallSize}px) ${cellSize}px`;
        board.style.gridTemplateRows = `repeat(${rows - 1}, ${cellSize}px ${wallSize}px) ${cellSize}px`;
        board.innerHTML = '';

        const mX = (cols - 1) * 2, mY = (rows - 1) * 2;
        for (let y = 0; y <= mY; y++) {
            for (let x = 0; x <= mX; x++) {
                const div = document.createElement('div');
                div.dataset.x = x;
                div.dataset.y = y;

                if (x % 2 === 0 && y % 2 === 0) {
                    div.className = 'cell';
                    div.style.width = cellSize + 'px';
                    div.style.height = cellSize + 'px';
                    div.style.fontSize = Math.round(cellSize * 0.62) + 'px';
                    if (!isCustom() && (y === 0 || y === mY)) div.classList.add('bank-cell');
                    div.onclick = () => handleCellClick(x, y);
                } else if (x % 2 !== 0 && y % 2 === 0) {
                    div.className = 'wall-v';
                    div.style.width = wallSize + 'px';
                    div.style.height = cellSize + 'px';
                    div.onclick = () => handleWallClick(x, y, 'v');
                } else if (x % 2 === 0 && y % 2 !== 0) {
                    div.className = 'wall-h';
                    div.style.width = cellSize + 'px';
                    div.style.height = wallSize + 'px';
                    div.onclick = () => handleWallClick(x, y, 'h');
                } else {
                    div.className = 'wall-c';
                    div.style.width = wallSize + 'px';
                    div.style.height = wallSize + 'px';
                }
                board.appendChild(div);
            }
        }
        paintGoals();
    }

    // 在棋盤上塗出終點（多色漸層）
    function paintGoals() {
        const map = new Map();
        activeRoles().forEach(role => {
            goalsOf(role).forEach(g => {
                const k = `${g.x},${g.y}`;
                if (!map.has(k)) map.set(k, []);
                map.get(k).push(IDX_OF(role));
            });
        });
        document.querySelectorAll('#board .cell').forEach(c => {
            c.style.background = '';
            c.style.boxShadow = '';
            c.classList.remove('goal-cell');
        });
        map.forEach((owners, k) => {
            const [x, y] = k.split(',');
            const cell = document.querySelector(`#board [data-x="${x}"][data-y="${y}"]`);
            if (!cell) return;
            cell.classList.add('goal-cell');
            const css = multiColorStyle(owners.sort((a, b) => a - b));
            css.split(';').forEach(rule => {
                const [prop, ...rest] = rule.split(':');
                if (!prop.trim() || !rest.length) return;
                cell.style.setProperty(prop.trim(), rest.join(':').trim());
            });
        });
    }

    function updateUI() {
        if (!gameState) return;
        createBoardUI();
        const players = gameState.players ? Object.values(gameState.players) : [];
        const myRole = getMyRole();
        const me = players.find(p => p.id === myRole) || players[0];

        const status = document.getElementById('status-bar');
        const startBtn = document.getElementById('btn-start-game');
        const undoBtn = document.getElementById('btn-undo');

        // ---- 標準 2 人模式才旋轉視角 ----
        const boardEl = document.getElementById('board');
        const topLabel = document.getElementById('bank-label-top');
        const bottomLabel = document.getElementById('bank-label-bottom');
        if (isCustom()) {
            boardEl.classList.remove('rotated');
            topLabel.style.display = 'none';
            bottomLabel.style.display = 'none';
        } else {
            topLabel.style.display = 'block';
            bottomLabel.style.display = 'block';
            const isP2 = !localMode && myRole === 'p2';
            if (isP2) {
                boardEl.classList.add('rotated');
                topLabel.innerText = '⬆️ 我方 (P2 的起始區) ⬆️';
                bottomLabel.innerText = '⬇️ 對岸 (P1 的起始區) ⬇️';
            } else {
                boardEl.classList.remove('rotated');
                topLabel.innerText = '⬆️ 對岸 (P2 的起始區) ⬆️';
                bottomLabel.innerText = '⬇️ 我方 (P1 的起始區) ⬇️';
            }
        }

        if (gameState.status === 'waiting') {
            status.innerText = `房間：${gameState.name} | 等待中 (${players.length}/${maxPlayers()})`;
            if (isHost) {
                startBtn.style.display = 'block';
                const cap = maxPlayers();
                if (players.length <= 1) {
                    startBtn.innerText = '開始單機模式';
                    startBtn.disabled = false;
                } else {
                    startBtn.innerText = players.length >= cap
                        ? '開始遊戲' : `開始遊戲 (${players.length}/${cap})`;
                    startBtn.disabled = players.length < cap;
                }
            } else {
                startBtn.style.display = 'none';
            }
            undoBtn.style.display = 'none';
        } else if (gameState.status === 'playing') {
            startBtn.style.display = 'none';
            undoBtn.style.display = 'block';
            const isMyTurn = localMode || (me && gameState.turn === me.id);
            const turnPlayer = players.find(p => p.id === gameState.turn);
            const turnName = turnPlayer ? turnPlayer.name : '';
            status.innerText = isMyTurn ? "👉 現在輪到你了！" : `⏳ 等待 ${turnName} 行動...`;
            status.style.color = isMyTurn ? "#10b981" : "#facc15";
            renderBoard();
        } else if (gameState.status === 'finished') {
            status.innerText = `🎉 遊戲結束！贏家：${gameState.winner}`;
            undoBtn.style.display = 'none';
            if (!winShown) {
                winShown = true;
                showWinAnimation(gameState.winner, gameState.winnerEmoji);
            }
        }
    }

    function renderBoard() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('valid-move'));
        document.querySelectorAll('#board .cell > span').forEach(s => s.remove());
        document.querySelectorAll('.wall-h, .wall-v, .wall-c').forEach(w => {
            w.classList.remove('wall-filled', 'wall-pending', 'wall-highlight');
        });

        const walls = gameState.board?.walls || [];
        walls.forEach(w => {
            const el1 = document.querySelector(`[data-x="${w.x}"][data-y="${w.y}"]`);
            let el2, el3;
            if (w.type === 'h') {
                el2 = document.querySelector(`[data-x="${w.x+1}"][data-y="${w.y}"]`);
                el3 = document.querySelector(`[data-x="${w.x+2}"][data-y="${w.y}"]`);
            } else {
                el2 = document.querySelector(`[data-x="${w.x}"][data-y="${w.y+1}"]`);
                el3 = document.querySelector(`[data-x="${w.x}"][data-y="${w.y+2}"]`);
            }
            if (el1) el1.classList.add('wall-filled');
            if (el2) el2.classList.add('wall-filled');
            if (el3) el3.classList.add('wall-filled');
        });

        if (pendingWall) {
            const el = document.querySelector(`[data-x="${pendingWall.x}"][data-y="${pendingWall.y}"]`);
            if (el) el.classList.add('wall-pending');
            pendingWall.validHalves.forEach(half => {
                const hEl = document.querySelector(`[data-x="${half.x}"][data-y="${half.y}"]`);
                if (hEl) hEl.classList.add('wall-highlight');
            });
        }

        // 畫玩家
        activeRoles().forEach(role => {
            const p = Object.values(gameState.players || {}).find(pl => pl.id === role);
            const pos = gameState.board?.[role];
            if (p && pos) placePlayer(pos.x, pos.y, p.emoji, role);
        });

        const myRole = localMode ? gameState.turn : getMyRole();
        const myPlayer = Object.values(gameState.players || {}).find(p => p.id === myRole);
        document.getElementById('wall-count').innerText =
            myPlayer ? `🧱 剩餘牆壁 - 你: ${myPlayer.wallsLeft}` : '';
    }

    function placePlayer(x, y, emoji, playerRole) {
        const cell = document.querySelector(`#board [data-x="${x}"][data-y="${y}"]`);
        if (!cell) return;
        const span = document.createElement('span');
        span.className = 'player-emoji';
        span.innerText = emoji;
        span.style.outline = `2px solid ${PLAYER_COLORS[IDX_OF(playerRole)]}`;
        span.style.borderRadius = '50%';
        span.onclick = (e) => {
            e.stopPropagation();
            if (pendingWall) { pendingWall = null; renderBoard(); }
            const myRole = localMode ? gameState.turn : getMyRole();
            const isMyPiece = (playerRole === myRole);
            const isMyTurn = localMode || (gameState.players[myPlayerId]?.id === gameState.turn);
            if (isMyTurn && isMyPiece && gameState.status === 'playing') previewMoves(x, y);
        };
        cell.appendChild(span);
    }

    function isWallBlocked(x, y) {
        if (!gameState || !gameState.board || !gameState.board.walls) return false;
        for (let w of gameState.board.walls) {
            if (w.type === 'h') {
                if (y === w.y && x >= w.x && x <= w.x + 2) return true;
            } else {
                if (x === w.x && y >= w.y && y <= w.y + 2) return true;
            }
        }
        return false;
    }

    function pawnAt(x, y, exceptRole) {
        return activeRoles().some(role => {
            if (role === exceptRole) return false;
            const p = gameState.board?.[role];
            return p && p.x === x && p.y === y;
        });
    }

    function inBounds(x, y) { return x >= 0 && x <= maxX() && y >= 0 && y <= maxY(); }

    function getValidMoves(x, y) {
        const moves = [];
        const directions = [[0, -2], [0, 2], [-2, 0], [2, 0]];
        const selfRole = gameState.turn;

        directions.forEach(d => {
            const nx = x + d[0], ny = y + d[1];
            const wx = x + d[0] / 2, wy = y + d[1] / 2;
            if (!inBounds(nx, ny) || isWallBlocked(wx, wy)) return;

            if (pawnAt(nx, ny, selfRole)) {
                const nnx = nx + d[0], nny = ny + d[1];
                const nwx = nx + d[0] / 2, nwy = ny + d[1] / 2;
                if (inBounds(nnx, nny) && !isWallBlocked(nwx, nwy) && !pawnAt(nnx, nny, selfRole)) {
                    moves.push({ x: nnx, y: nny });
                } else {
                    const crossDirs = d[0] === 0 ? [[-2, 0], [2, 0]] : [[0, -2], [0, 2]];
                    crossDirs.forEach(cd => {
                        const dx = nx + cd[0], dy = ny + cd[1];
                        const dwx = nx + cd[0] / 2, dwy = ny + cd[1] / 2;
                        if (inBounds(dx, dy) && !isWallBlocked(dwx, dwy) && !pawnAt(dx, dy, selfRole)) {
                            moves.push({ x: dx, y: dy });
                        }
                    });
                }
            } else {
                moves.push({ x: nx, y: ny });
            }
        });
        return moves;
    }

    function previewMoves(x, y) {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('valid-move'));
        selectedPawn = true;
        getValidMoves(x, y).forEach(m => {
            const cell = document.querySelector(`#board [data-x="${m.x}"][data-y="${m.y}"]`);
            if (cell) cell.classList.add('valid-move');
        });
    }

    async function handleCellClick(x, y) {
        const isMyTurn = localMode || (gameState.players[myPlayerId]?.id === gameState.turn);
        if (pendingWall) { pendingWall = null; renderBoard(); }
        if (!selectedPawn || !isMyTurn || gameState.status !== 'playing') return;

        const cell = document.querySelector(`#board [data-x="${x}"][data-y="${y}"]`);
        if (!cell || !cell.classList.contains('valid-move')) return;

        const currentTurn = gameState.turn;
        moveHistory.push(snapshotState());

        const updateData = { [`board/${currentTurn}`]: { x, y }, turn: nextTurnRole(currentTurn) };

        // 終點判斷：走到自己任一自訂終點即獲勝
        const won = goalsOf(currentTurn).some(g => g.x === x && g.y === y);
        if (won) {
            updateData.status = 'finished';
            const winnerPlayer = Object.values(gameState.players).find(p => p.id === currentTurn);
            updateData.winner = winnerPlayer?.name || currentTurn;
            updateData.winnerEmoji = winnerPlayer?.emoji || '🏆';
        }

        selectedPawn = false;
        await update(ref(db, `quoridor_rooms/${currentRoomId}`), updateData);
    }

    async function handleWallClick(x, y, type) {
        const isMyTurn = localMode || (gameState.players[myPlayerId]?.id === gameState.turn);
        if (!isMyTurn || gameState.status !== 'playing') return;

        if (pendingWall) {
            const isSecondHalf = pendingWall.validHalves.find(h => h.x === x && h.y === y && pendingWall.type === type);
            if (isSecondHalf) {
                const fullX = type === 'h' ? Math.min(x, pendingWall.x) : x;
                const fullY = type === 'h' ? y : Math.min(y, pendingWall.y);
                await placeFullWall(fullX, fullY, type);
                return;
            } else {
                pendingWall = null;
            }
        }

        if (isWallBlocked(x, y)) return;

        let validHalves = [];
        if (type === 'h') {
            if (x + 2 <= maxX() && !isWallBlocked(x + 1, y) && !isWallBlocked(x + 2, y)) validHalves.push({ x: x + 2, y });
            if (x - 2 >= 0 && !isWallBlocked(x - 1, y) && !isWallBlocked(x - 2, y)) validHalves.push({ x: x - 2, y });
        } else {
            if (y + 2 <= maxY() && !isWallBlocked(x, y + 1) && !isWallBlocked(x, y + 2)) validHalves.push({ x, y: y + 2 });
            if (y - 2 >= 0 && !isWallBlocked(x, y - 1) && !isWallBlocked(x, y - 2)) validHalves.push({ x, y: y - 2 });
        }

        if (validHalves.length > 0) {
            pendingWall = { x, y, type, validHalves };
            renderBoard();
        }
    }

    async function placeFullWall(x, y, type) {
        if (!canReachEnd(x, y, type)) {
            alert("不能完全堵死任何一位玩家通往終點的路！（關廁所違規），請重來！");
            pendingWall = null;
            renderBoard();
            return;
        }

        const currentTurn = gameState.turn;
        const playerKey = Object.keys(gameState.players).find(k => gameState.players[k].id === currentTurn);
        const wallsLeft = gameState.players[playerKey].wallsLeft;
        if (wallsLeft <= 0) { alert("牆壁用完了！"); pendingWall = null; renderBoard(); return; }

        moveHistory.push(snapshotState());

        const currentWalls = [...(gameState.board.walls || []), { x, y, type }];
        pendingWall = null;

        await update(ref(db, `quoridor_rooms/${currentRoomId}`), {
            'board/walls': currentWalls,
            turn: nextTurnRole(currentTurn),
            [`players/${playerKey}/wallsLeft`]: wallsLeft - 1
        });
    }

    // 每位在場玩家都必須還能走到自己任一終點
    function canReachEnd(testStartX, testStartY, testType) {
        const oldWalls = gameState.board.walls || [];
        gameState.board.walls = [...oldWalls, { x: testStartX, y: testStartY, type: testType }];

        let ok = true;
        for (const role of activeRoles()) {
            const pos = gameState.board[role];
            if (!pos) continue;
            if (!bfs(pos.x, pos.y, goalsOf(role))) { ok = false; break; }
        }

        gameState.board.walls = oldWalls;
        return ok;
    }

    // BFS：目標為自訂終點座標陣列，抵達任一個即算通過
    function bfs(startX, startY, goalList) {
        const targets = new Set((goalList || []).map(g => `${g.x},${g.y}`));
        if (targets.size === 0) return true;
        const queue = [{ x: startX, y: startY }];
        const visited = new Set([`${startX},${startY}`]);
        const directions = [[0, -2], [0, 2], [-2, 0], [2, 0]];

        while (queue.length > 0) {
            const curr = queue.shift();
            if (targets.has(`${curr.x},${curr.y}`)) return true;
            for (let d of directions) {
                const nx = curr.x + d[0], ny = curr.y + d[1];
                const wx = curr.x + d[0] / 2, wy = curr.y + d[1] / 2;
                if (inBounds(nx, ny) && !visited.has(`${nx},${ny}`) && !isWallBlocked(wx, wy)) {
                    visited.add(`${nx},${ny}`);
                    queue.push({ x: nx, y: ny });
                }
            }
        }
        return false;
    }

    // ========== 勝利動畫 ==========
    function showWinAnimation(winnerName, winnerEmoji) {
        const overlay = document.getElementById('win-overlay');
        document.getElementById('win-emoji').innerText = winnerEmoji || '🏆';
        document.getElementById('win-title').innerText = `${winnerName} 獲勝！`;
        document.getElementById('win-subtitle').innerText = `恭喜 ${winnerEmoji || '🏆'} ${winnerName} 步步為營、勝利！`;
        overlay.classList.add('show');
        spawnConfetti();
    }

    function spawnConfetti() {
        const wrapper = document.getElementById('confetti-wrapper');
        wrapper.innerHTML = '';
        const colors = ['#facc15','#f97316','#a78bfa','#60a5fa','#34d399','#fb7185','#fff'];
        for (let i = 0; i < 80; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            const left = Math.random() * 100;
            const delay = Math.random() * 2;
            const duration = 2.5 + Math.random() * 2;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = 8 + Math.floor(Math.random() * 8);
            piece.style.cssText = `
                left: ${left}%;
                width: ${size}px;
                height: ${size + 4}px;
                background: ${color};
                animation-delay: ${delay}s;
                animation-duration: ${duration}s;
            `;
            wrapper.appendChild(piece);
        }
    }
</script>
